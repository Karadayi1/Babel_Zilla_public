#conecciones a la db y credenciales
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: babel-zilla-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-babelzilla}
    ports:
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - babel-network

  app:
    build: .
    container_name: babel-zilla-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-babelzilla}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-credentials.json
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./secrets:/app/secrets
    depends_on:
      - db
    networks:
      - babel-network

  main-backend:
    build: ./main-backend
    container_name: main-backend
    restart: always
    environment:
      - BABEL_ZILLA_URL=http://app:8000/translate
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/node_db
    ports:
      - "3001:3001"
    depends_on:
      - app
    networks:
      - babel-network

networks:
  babel-network:
    driver: bridge

volumes:
  postgres_data:
